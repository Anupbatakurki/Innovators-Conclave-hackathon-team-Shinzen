<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="GreenLedger — campus savings you can prove" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F231B"/>
      <stop offset="0.55" stop-color="#1E3F33"/>
      <stop offset="1" stop-color="#2E5A44"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#CDE46A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#CDE46A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#E9F5C4"/>
      <stop offset="1" stop-color="#CDE46A"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#CDE46A" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .float { animation: float 7s ease-in-out infinite; }
    .float2 { animation: float 9s ease-in-out infinite; animation-delay: -3s; }
    .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: 1110px 70px; transform-box: view-box; }
    .dot { animation: rise 8s linear infinite; }
    .d2 { animation-delay: -2s; } .d3 { animation-delay: -4s; } .d4 { animation-delay: -6s; } .d5 { animation-delay: -1s; } .d6 { animation-delay: -5s; }
    .ghost { stroke-dasharray: 10 8; animation: dash 6s linear infinite; }
    .live { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 4s ease-out forwards, hold 8s 4s infinite; }
    .gap { animation: fade 4s ease-in-out infinite; }
    .tag { animation: fade 5s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.08); opacity: 1; } }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(-260px); opacity: 0; } }
    @keyframes dash { to { stroke-dashoffset: -180; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes hold { 0%,100% { stroke-dashoffset: 0; } }
    @keyframes fade { 0%,100% { opacity: .35; } 50% { opacity: .85; } }
  </style>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="24" fill="url(#glow)"/>

  <!-- rising energy particles -->
  <g fill="#CDE46A">
    <circle class="dot" cx="640" cy="420" r="3"/>
    <circle class="dot d2" cx="720" cy="430" r="2"/>
    <circle class="dot d3" cx="860" cy="425" r="3"/>
    <circle class="dot d4" cx="940" cy="430" r="2"/>
    <circle class="dot d5" cx="1080" cy="425" r="2.5"/>
    <circle class="dot d6" cx="1150" cy="430" r="2"/>
  </g>

  <!-- live vs ghost twin chart -->
  <g transform="translate(730,140) scale(0.8)"><g class="float2">
    <rect x="0" y="0" width="520" height="190" rx="16" fill="#0F231B" fill-opacity="0.55" stroke="#CDE46A" stroke-opacity="0.25"/>
    <text x="22" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#BFD3C6">LIVE TWIN vs GHOST TWIN</text>
    <path class="gap" d="M30 120 C 100 90, 160 110, 230 80 S 360 70, 420 60 L 490 55 L 490 110 C 420 118, 360 128, 300 122 S 160 150, 100 140 L 30 150 Z" fill="#CDE46A" fill-opacity="0.35"/>
    <path class="ghost" d="M30 120 C 100 90, 160 110, 230 80 S 360 70, 420 60 L 490 55" fill="none" stroke="#97A59C" stroke-width="3"/>
    <path class="live" d="M30 150 C 100 140, 160 150, 230 128 S 360 128, 420 118 L 490 110" fill="none" stroke="#CDE46A" stroke-width="4" stroke-linecap="round"/>
    <text x="22" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#97A59C">- - ghost: without the change</text>
    <text x="250" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#CDE46A">— live: what really happened</text>
  </g></g>

  <!-- verified badge -->
  <g class="pulse">
    <circle cx="1110" cy="70" r="38" fill="#CDE46A" fill-opacity="0.15" stroke="#CDE46A" stroke-width="2"/>
    <path d="M1092 70 l12 12 l23 -25" fill="none" stroke="#CDE46A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- leaf mark + title -->
  <g class="float">
    <g transform="translate(64,92)">
      <path d="M0 40 C 0 10, 30 -6, 62 0 C 66 32, 46 62, 14 62 C 8 62, 3 58, 0 52 Z" fill="#CDE46A"/>
      <path d="M6 56 C 20 38, 36 24, 54 10" fill="none" stroke="#1E3F33" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="146" y="146" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="74" font-weight="800" letter-spacing="-2" fill="url(#title)">GreenLedger</text>
  </g>
  <text x="66" y="208" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#FFFFFF">Campus savings you can <tspan fill="#CDE46A">prove</tspan> — not just claim.</text>
  <text x="66" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#BFD3C6">Electricity · water · waste · e-waste · carbon — one ledger for every department.</text>

  <g class="tag" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">
    <rect x="66" y="290" width="150" height="34" rx="17" fill="#CDE46A" fill-opacity="0.15" stroke="#CDE46A" stroke-opacity="0.6"/>
    <text x="141" y="312" text-anchor="middle" fill="#CDE46A">SEE</text>
    <rect x="228" y="290" width="150" height="34" rx="17" fill="#CDE46A" fill-opacity="0.15" stroke="#CDE46A" stroke-opacity="0.6"/>
    <text x="303" y="312" text-anchor="middle" fill="#CDE46A">ACT</text>
    <rect x="390" y="290" width="150" height="34" rx="17" fill="#CDE46A" stroke="#CDE46A"/>
    <text x="465" y="312" text-anchor="middle" fill="#1E3F33">PROVE</text>
  </g>
  <text x="66" y="376" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" letter-spacing="1.5" fill="#97A59C">TEAM SHINZEN · DAYANANDA SAGAR UNIVERSITY · INNOVATORS CONCLAVE 2026 · IC26-05-01</text>
</svg>
